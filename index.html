<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faultier 1x1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf8f3;--ink:#4a3a30;--brown:#c49a6c;--branch:#6b4a35;--sage:#a9bfae;--sage-d:#6f8f78;--patch:#4a4a4f;--rose:#e8a598;--card:#fffdf9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Baloo 2","Nunito","Trebuchet MS",sans-serif;font-weight:500}
body{display:flex;justify-content:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#app{width:100%;max-width:460px;padding:14px 0 28px;display:flex;flex-direction:column;gap:12px}
h1{font-size:2.2rem;font-weight:800;margin:0;text-align:center;line-height:1}
h2{margin:0 0 6px;font-size:1.3rem;font-weight:800}
.screen{display:none;flex-direction:column;gap:12px}.screen.on{display:flex}
.card{background:var(--card);border-radius:26px 30px 24px 32px;padding:16px;box-shadow:0 2px 0 #e6dccd,0 10px 24px -14px rgba(107,74,53,.5);border:2px solid #efe5d6}
button{font:inherit;font-weight:800;border:0;border-radius:22px;padding:12px 18px;color:#fff;background:var(--sage-d);box-shadow:0 5px 0 #557461;cursor:pointer;font-size:1.15rem}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #557461}
button.alt{background:var(--brown);box-shadow:0 5px 0 #98744c}
button.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid #e6dccd;font-size:1rem;padding:8px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
input,select{font:inherit;width:100%;padding:12px 14px;border-radius:18px;border:2px solid #e6dccd;background:#fff;color:var(--ink);font-size:1.1rem}
label{font-weight:700;font-size:.95rem}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.stage{position:relative;height:190px}
.stage svg{width:100%;height:100%;overflow:visible}
.sloth{transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-1.6deg) translateY(2px)}}
.open{display:none}.happy .open,.sad .open{display:inline}.happy .shut,.sad .shut{display:none}
.happy .sloth{animation:hop .5s}
.sad .sloth{animation:shake .4s}
@keyframes hop{40%{transform:translateY(-16px) rotate(2deg)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hat{font-size:34px;text-anchor:middle}
.pill{background:#f1e7d8;border-radius:999px;padding:3px 12px;font-weight:800;font-size:.95rem;white-space:nowrap}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:14px;background:#efe5d6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--sage-d);border-radius:99px;transition:width .25s linear}
.q{font-size:3.4rem;font-weight:800;text-align:center;line-height:1.05;margin:2px 0 6px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers button{font-size:1.8rem;padding:16px 6px;background:#fff;color:var(--ink);box-shadow:0 5px 0 #e0d2bd;border:2px solid #efe5d6}
.answers button.ok{background:var(--sage);box-shadow:0 5px 0 var(--sage-d)}
.answers button.no{background:var(--rose);box-shadow:0 5px 0 #c6796b}
.combo{min-height:1.7rem;text-align:center;font-weight:800;color:var(--sage-d);font-size:1.2rem}
ol{margin:0;padding:0;list-style:none;counter-reset:n}
ol li{counter-increment:n;display:flex;gap:10px;padding:7px 10px;border-radius:14px;align-items:center}
ol li:before{content:counter(n);font-weight:800;width:1.6rem;height:1.6rem;border-radius:50%;background:#f1e7d8;display:grid;place-items:center;font-size:.9rem}
ol li:nth-child(1):before{background:#f3d98b}ol li.me{background:#eef4ee}
ol li span:nth-child(2){margin-left:auto;font-weight:800}
.err{color:#b4503f;min-height:1.3rem;font-weight:700;font-size:.95rem}
.big{font-size:3rem;font-weight:800;text-align:center;line-height:1}
.small{font-size:.9rem;opacity:.75;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .29 0 0 0 0 .21 0 0 0 .07 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
h1{color:var(--branch)}
.snake{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.slither{animation:slither .7s ease-in-out infinite alternate}
@keyframes slither{to{transform:translateY(3px) skewY(2deg)}}
.tongue{animation:flick .5s steps(2) infinite}
@keyframes flick{50%{opacity:0}}
.danger .tongue{animation-duration:.2s}
.shot{opacity:0}.shot.fire{animation:fire .35s ease-out}
@keyframes fire{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),8px) rotate(400deg)}}
.lives{display:flex;gap:3px}
.arm{transform-origin:190px 100px}
.push .arm{animation:swat .45s ease-out}
@keyframes swat{35%,60%{transform:rotate(-82deg)}}
.push .slither{animation:recoil .45s}
@keyframes recoil{30%{transform:translateX(16px) skewY(-7deg)}}
.wrap{flex-wrap:wrap;justify-content:flex-start}
.wrap button{padding:6px 12px;font-size:.95rem}
#bstage svg{width:100%;display:block;border-radius:22px}
#bbar{width:0}@keyframes grow{from{width:0}to{width:100%}}
.bb{transform-origin:160px 160px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,.985)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.4s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.fly{animation:fly 10s linear both}
@keyframes fly{from{transform:translate(-30px,50px)}50%{transform:translate(160px,18px)}to{transform:translate(350px,60px)}}
.flap{transform-box:fill-box;transform-origin:center;animation:flap .25s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.35)}}
.heart{opacity:0;animation:rise 2.4s ease-out both}
@keyframes rise{0%{opacity:0;transform:translateY(0)}25%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}
.sb{stroke:var(--sn,#7d9b6b)}.sh{fill:var(--sn,#7d9b6b);rx:var(--hx,17px);ry:var(--hy,12px)}.bw{stroke-width:var(--sw,15px)}
.pr{display:grid;grid-template-columns:2.6rem 1fr 2.8rem;gap:8px;align-items:center;font-weight:700}.pr span:last-child{text-align:right}
#sol .big{font-size:2.4rem}#sol{text-align:center}
</style>
</head>
<body>
<div id="app">
<h1>Faultier 1x1</h1>

<div class="stage" id="stage">
<svg viewBox="0 0 320 190" aria-label="Faultier verteidigt seinen Ast gegen eine Schlange">
<defs>
<filter id="paint" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
<filter id="wash"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="22"/><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<g filter="url(#wash)" opacity=".55"><ellipse cx="90" cy="75" rx="90" ry="55" fill="#d3e2d5"/><ellipse cx="245" cy="55" rx="70" ry="38" fill="#f3e0d0"/></g>
<g filter="url(#paint)">
<path d="M-6 128 Q100 118 200 126 L330 112 L330 124 L205 142 Q100 144 -6 148Z" fill="#6b4a35"/>
<g fill="#a9bfae"><ellipse cx="40" cy="154" rx="13" ry="6" transform="rotate(60 40 154)"/><ellipse cx="62" cy="108" rx="14" ry="6" transform="rotate(-35 62 108)"/><ellipse cx="248" cy="158" rx="12" ry="5" transform="rotate(70 248 158)"/></g>
<g id="snake" class="snake" style="transform:translate(340px,112px)"><g class="slither">
<path d="M0 2C22-14 40 16 64 2S106-14 130 2 170 14 200 0" fill="none" class="sb bw" stroke="#7d9b6b" stroke-width="15" stroke-linecap="round"/>
<path d="M0 2C22-14 40 16 64 2S106-14 130 2 170 14 200 0" fill="none" class="bw" stroke="#c5d8ae" stroke-width="15" stroke-dasharray="3 11" opacity=".8"/>
<ellipse class="sh" cx="-2" cy="0" rx="17" ry="12" fill="#7d9b6b"/>
<circle cx="-8" cy="-4" r="3.6" fill="#fff"/><circle cx="-9" cy="-4" r="1.8" fill="#222"/>
<path class="tongue" d="M-18 3h-12m12 0l-8-4m8 4l-8 4" stroke="#c9605a" stroke-width="2" fill="none" stroke-linecap="round"/>
</g></g>
<g class="sloth">
<ellipse cx="110" cy="96" rx="76" ry="42" fill="#c49a6c"/>
<ellipse cx="90" cy="150" rx="15" ry="34" fill="#b88b5c" transform="rotate(8 90 130)"/>
<ellipse cx="148" cy="148" rx="13" ry="30" fill="#b88b5c" transform="rotate(-6 148 130)"/>
<g class="arm"><ellipse cx="190" cy="136" rx="11" ry="36" fill="#b88b5c"/><path d="M184 168l-2 8M190 171v9M196 168l2 8" stroke="#4a3a30" stroke-width="2.5" stroke-linecap="round"/></g>
<circle cx="178" cy="78" r="40" fill="#d1a778"/>
<ellipse cx="180" cy="84" rx="29" ry="25" fill="#f7e8d5"/>
<ellipse cx="166" cy="82" rx="12" ry="8" fill="#4a4a4f" transform="rotate(14 166 82)"/>
<ellipse cx="194" cy="82" rx="12" ry="8" fill="#4a4a4f" transform="rotate(-14 194 82)"/>
<g class="shut"><path d="M160 82q6 5 12 0M188 82q6 5 12 0" stroke="#f7e8d5" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
<g class="open"><circle cx="166" cy="81" r="5" fill="#fff"/><circle cx="194" cy="81" r="5" fill="#fff"/><circle cx="167" cy="82" r="2.6" fill="#222"/><circle cx="195" cy="82" r="2.6" fill="#222"/></g>
<ellipse cx="180" cy="95" rx="5" ry="3.6" fill="#2b2b2e"/>
<path d="M173 101q7 6 14 0" stroke="#4a3a30" stroke-width="2" fill="none" stroke-linecap="round"/>
<g id="hat"></g>
</g>
<g transform="translate(212 92)"><path id="shot" class="shot" d="M0 0q9-9 20 0-9 9-20 0z" fill="#6f8f78"/></g>
</g></svg>
</div>

<!-- LOGIN -->
<section class="screen" id="s-auth"><div class="card stack">
<h2 id="authTitle">Wer bist du?</h2>
<div><label for="nick">Spitzname</label><input id="nick" autocomplete="username" maxlength="12" placeholder="z. B. Mia"></div>
<div><label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password" placeholder="mindestens 6 Zeichen"></div>
<div class="err" id="err"></div>
<button id="go">Einloggen</button>
<button class="ghost" id="swap">Neu hier? Konto erstellen</button>
</div></section>

<!-- MENÜ -->
<section class="screen" id="s-menu">
<div class="card stack">
<div class="row"><h2 id="hello"></h2><button class="ghost" id="out">Abmelden</button></div>
<div class="row"><span class="pill" id="pStreak"></span><span class="pill" id="pBest"></span><span class="pill" id="pTotal"></span></div>
<div class="small" id="goal"></div><div class="bar"><i id="goalBar" style="width:0"></i></div>
<div><label for="row">Welche Reihe üben?</label><select id="row"><option value="0">Alle Reihen (Mix)</option></select></div>
<div class="stack"><div class="row"><b>Tagesquest: Schlangen vertreiben</b><span class="small" id="qTxt"></span></div><div class="bar"><i id="qBar" style="width:0"></i></div>
<div class="row"><b>Tagesquest: 25 richtige Antworten</b><span class="small" id="qTxt2"></span></div><div class="bar"><i id="qBar2" style="width:0"></i></div>
<div class="small" style="text-align:left">Belohnungen: Schlangen-Quest = Faultier-Baby, Antwort-Quest = Minigame-Ticket. Dein Album:</div><div class="row wrap" id="album"></div><button class="alt" id="mini" style="display:none"></button></div>
<button id="play">Runde starten (60 s)</button>
</div>
<div class="card stack"><h2>Dein Fortschritt</h2><div id="prog" class="stack"></div><div class="small" id="tip"></div></div>
<div class="card"><h2>Die schnellsten Faultiere</h2><ol id="top"></ol></div>
</section>

<!-- MINIGAME -->
<section class="screen" id="s-mini"><div class="card stack">
<h2 style="text-align:center">Blätterfang</h2>
<div class="row"><span class="pill" id="mScore">0 Blätter</span><span class="pill" id="mTime">20 s</span></div>
<canvas id="mc" width="320" height="360" style="width:100%;touch-action:none;border-radius:22px;background:#eef4ee"></canvas>
<div class="small" id="mInfo"></div>
<button id="mBack" class="alt" style="display:none">Zurück</button>
</div></section>

<!-- BABY -->
<section class="screen" id="s-baby"><div class="card stack">
<h2 id="bName" style="text-align:center"></h2><div id="bstage"></div>
<div class="bar"><i id="bbar"></i></div><div class="small" id="bFact"></div>
<button id="bBack" class="alt">Zurück</button>
</div></section>

<!-- SPIEL -->
<section class="screen" id="s-game"><div class="card stack">
<div class="hud"><span class="pill" id="gScore"></span><span class="lives" id="gLives"></span><span class="pill" id="gTime"></span></div>
<div class="bar"><i id="tbar"></i></div>
<div class="small" id="eName"></div><div class="q" id="q"></div>
<div class="answers" id="ans"></div>
<div class="combo" id="cmsg"></div><div id="sol" class="stack"></div>
</div></section>

<!-- ENDE -->
<section class="screen" id="s-end"><div class="card stack">
<h2 id="eTitle" style="text-align:center"></h2>
<div class="big" id="eScore"></div>
<div class="small" id="eInfo"></div>
<div class="small" id="eNext"></div><div class="bar"><i id="eBar" style="width:0"></i></div>
<button id="bReward" style="display:none">Belohnung: Baby ansehen</button>
<button id="again">Nochmal!</button>
<button class="alt" id="toMenu">Zur Bestenliste</button>
</div></section>
</div>

<script type="module">
/* ============ 1) HIER DEINE FIREBASE-DATEN EINTRAGEN ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAYc71YeZVFmjf5-C-Q9Xm2mbQ7svZ3d-g",
  authDomain: "faultier-1x1.firebaseapp.com",
  projectId: "faultier-1x1",
  appId: "1:717077204716:web:83548269ddf28d99001fc9"
};
/* ================================================================= */

const OFFLINE = firebaseConfig.apiKey.startsWith("DEIN");
let fb = {}, user = null, prof = null, registering = false;
const $ = id => document.getElementById(id);
const show = id => { $("stage").style.display = id === "s-baby" || id === "s-mini" ? "none" : ""; document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); };

if (!OFFLINE) {
  const V = "10.12.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{initializeApp}, A, F] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
  const app = initializeApp(firebaseConfig);
  fb = { A, F, auth: A.getAuth(app), db: F.getFirestore(app) };
}

/* ---------- Items zum Freischalten ---------- */
const ITEMS = [[0,"",""],[100,"Blumenkrone",`<g><path d="M150 58Q180 30 210 58" stroke="#8fae8f" stroke-width="4" fill="none"/><circle cx="156" cy="52" r="6" fill="#e8a598"/><circle cx="172" cy="40" r="6" fill="#fff"/><circle cx="188" cy="38" r="6" fill="#f3d98b"/><circle cx="204" cy="50" r="6" fill="#e8a598"/></g>`],[300,"Sonnenbrille",`<g><ellipse cx="166" cy="82" rx="14" ry="10" fill="#2b2b2e"/><ellipse cx="194" cy="82" rx="14" ry="10" fill="#2b2b2e"/><path d="M178 80h4M152 78l-8-4M208 78l8-4" stroke="#2b2b2e" stroke-width="3"/><path d="M158 77l8-3" stroke="#fff" stroke-width="2" opacity=".6"/></g>`],[600,"Zylinder",`<g><rect x="160" y="8" width="40" height="34" rx="3" fill="#3a3a3f"/><rect x="160" y="30" width="40" height="7" fill="#e8a598"/><ellipse cx="180" cy="42" rx="30" ry="6" fill="#2f2f33"/></g>`],[1000,"Krone",`<g><path d="M156 46L158 22L170 34L180 16L190 34L202 22L204 46Z" fill="#e3b94f"/><circle cx="180" cy="23" r="3" fill="#e8a598"/><circle cx="158" cy="25" r="2.5" fill="#e8a598"/><circle cx="202" cy="25" r="2.5" fill="#e8a598"/></g>`],[1800,"Kopfhörer",`<g><path d="M144 78A36 36 0 0 1 216 78" stroke="#4a4a4f" stroke-width="6" fill="none"/><ellipse cx="143" cy="80" rx="8" ry="13" fill="#6f8f78"/><ellipse cx="217" cy="80" rx="8" ry="13" fill="#6f8f78"/></g>`],[3000,"Zauberhut",`<g><path d="M154 44L182-2L206 44Z" fill="#5b6b9a"/><ellipse cx="180" cy="44" rx="34" ry="7" fill="#4a5985"/><path d="M178 22l2 5 5 .5-4 3 1.5 5-4.5-3-4.5 3 1.5-5-4-3 5-.5z" fill="#f3d98b"/></g>`],[5000,"Einhorn-Horn",`<g><path d="M172 46L181 6L190 46Z" fill="#f3d98b"/><path d="M175 36l14-5M174 26l12-4" stroke="#e3b94f" stroke-width="2"/><path d="M150 48q-10-14 4-20 2 12 8 16zM210 48q10-14-4-20-2 12-8 16z" fill="#e8a598"/></g>`]];
const itemFor = t => ITEMS.filter(i => t >= i[0]).pop();
const nextItem = t => ITEMS.find(i => i[0] > t);
const today = (d = new Date()) => d.toLocaleDateString("sv-SE");

/* ---------- Daten ---------- */
async function loadProfile() {
  if (OFFLINE) return JSON.parse(localStorage.getItem("f1x1") || "null") || { name: "Gast", best: 0, total: 0, streak: 0, last: "" };
  const s = await fb.F.getDoc(fb.F.doc(fb.db, "users", user.uid));
  return s.exists() ? s.data() : { name: user.displayName || "Faultier", best: 0, total: 0, streak: 0, last: "" };
}
async function saveProfile() {
  if (OFFLINE) return localStorage.setItem("f1x1", JSON.stringify(prof));
  await fb.F.setDoc(fb.F.doc(fb.db, "users", user.uid), prof);
}
async function loadTop() {
  if (OFFLINE) return [prof];
  const q = fb.F.query(fb.F.collection(fb.db, "users"), fb.F.orderBy("best", "desc"), fb.F.limit(10));
  return (await fb.F.getDocs(q)).docs.map(d => ({ ...d.data(), uid: d.id }));
}

/* ---------- Auth ---------- */
const mail = n => n.toLowerCase() + "@faultier.spiel";
function setMode(reg) {
  registering = reg;
  $("authTitle").textContent = reg ? "Neues Faultier anmelden" : "Wer bist du?";
  $("go").textContent = reg ? "Konto erstellen" : "Einloggen";
  $("swap").textContent = reg ? "Schon dabei? Einloggen" : "Neu hier? Konto erstellen";
  $("pw").autocomplete = reg ? "new-password" : "current-password";
  $("err").textContent = "";
}
$("swap").onclick = () => setMode(!registering);
$("go").onclick = async () => {
  const n = $("nick").value.trim(), p = $("pw").value;
  if (!/^[A-Za-z0-9]{3,12}$/.test(n)) return $("err").textContent = "Spitzname: 3–12 Buchstaben oder Zahlen, ohne Leerzeichen.";
  if (p.length < 6) return $("err").textContent = "Das Passwort braucht mindestens 6 Zeichen.";
  $("go").disabled = true;
  try {
    const A = fb.A;
    if (registering) {
      const c = await A.createUserWithEmailAndPassword(fb.auth, mail(n), p);
      await A.updateProfile(c.user, { displayName: n });
    } else await A.signInWithEmailAndPassword(fb.auth, mail(n), p);
  } catch (e) {
    const m = { "auth/email-already-in-use": "Diesen Spitznamen gibt es schon. Nimm einen anderen!", "auth/invalid-credential": "Spitzname oder Passwort stimmt nicht.", "auth/network-request-failed": "Keine Internetverbindung." };
    $("err").textContent = m[e.code] || "Das hat nicht geklappt: " + e.code;
  }
  $("go").disabled = false;
};
$("out").onclick = () => OFFLINE ? null : fb.A.signOut(fb.auth);

async function enter() {
  prof = await loadProfile();
  prof.name = user?.displayName || prof.name;
  await menu();
}
if (OFFLINE) { user = { displayName: "Gast" }; enter(); }
else { fb.A.onAuthStateChanged(fb.auth, u => { user = u; u ? enter() : (setMode(false), show("s-auth")); }); }

/* ---------- Menü ---------- */
for (let i = 2; i <= 10; i++) $("row").add(new Option(`${i}er-Reihe`, i));
async function menu() {
  const streakOk = prof.last === today() || prof.last === today(new Date(Date.now() - 864e5));
  $("hello").textContent = `Hallo ${prof.name}!`;
  $("pStreak").textContent = `Serie ${streakOk ? prof.streak : 0} Tage`;
  $("pBest").textContent = `Rekord ${prof.best}`;
  $("pTotal").textContent = `${prof.total} Blätter`;
  $("out").style.display = OFFLINE ? "none" : "";
  const nx = nextItem(prof.total), cur = itemFor(prof.total);
  $("hat").innerHTML = cur[2];
  $("goal").textContent = nx ? `Noch ${nx[0] - prof.total} Blätter bis ${nx[1]} für dein Faultier` : "Alles freigeschaltet. Du bist die Faultier-Königin!";

  const un = Math.min(prof.babies || 0, BABIES.length);

  let worst = 0, wa = 2;
  $("prog").innerHTML = [2, 3, 4, 5, 6, 7, 8, 9, 10].map(a => { const [o, b] = (prof.rows || {})[a] || [0, 0], n = o + b, acc = n ? o / n : null; if (n >= 5 && acc < wa) { wa = acc; worst = a; } const pc = acc == null ? 0 : Math.round(acc * 100); return `<div class="pr"><span>${a}er</span><div class="bar"><i style="width:${pc}%;background:${pc >= 85 ? "#6f8f78" : pc >= 60 ? "#d9b35f" : "#d48a7c"}"></i></div><span>${acc == null ? "–" : pc + "%"}</span></div>`; }).join("");
  $("tip").innerHTML = worst ? `Hier kannst du noch besser werden: die ${worst}er-Reihe. <button class="ghost" id="prac">Gezielt üben</button>` : "Spiele ein paar Runden, dann siehst du hier deine Stärken.";

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Sound ---------- */
let ac;

  try { ac ||= new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch {}
}

const EN = [["Grüne Schlange", "#7d9b6b", 2, .9, 50, 15], ["Sand-Schlange", "#c9a35f", 3, 1.25, 70, 15], ["Giftschlange", "#9b6fb0", 4, 1.1, 100, 18], ["Riesenschlange (Boss)", "#4f7f8a", 6, 1, 200, 26]], SEQ = [0, 1, 2, 0, 1, 3];

function daily() { if (prof.qDay !== today()) Object.assign(prof, { qDay: today(), qCount: 0, qDone: false, qOk: 0, q2Done: false }); }

}
function playMini() {
  prof.tickets--; show("s-mini"); $("mBack").style.display = "none"; $("mInfo").textContent = "Bewege das Faultier und fang grüne Blätter. Braune Blätter sind faul und kosten Punkte!";
  const c = $("mc"), x = c.getContext("2d"); let px = 160, sc = 0, t = 20, items = [], last = performance.now(), sp = 0;
  const mv = e => { const r = c.getBoundingClientRect(); px = Math.max(30, Math.min(290, (e.clientX - r.left) / r.width * 320)); };

      if (Math.abs(i.x - px) < 30 && i.y > 300 && i.y < 345) { i.d = 1; sc = Math.max(0, sc + (i.bad ? -2 : 1)); beep(i.bad ? 200 : 600 + sc * 8, .1); }
    });
    items = items.filter(i => !i.d && i.y < 380);
    x.fillStyle = "#c49a6c"; x.beginPath(); x.arc(px, 328, 28, 0, 7); x.fill();
    x.fillStyle = "#f7e8d5"; x.beginPath(); x.ellipse(px, 333, 19, 16, 0, 0, 7); x.fill();
    [-9, 9].forEach(o => { x.fillStyle = "#4a4a4f"; x.beginPath(); x.ellipse(px + o, 330, 8, 5.5, o / 30, 0, 7); x.fill(); x.fillStyle = "#fff"; x.beginPath(); x.arc(px + o, 330, 2.6, 0, 7); x.fill(); });
    x.fillStyle = "#2b2b2e"; x.beginPath(); x.ellipse(px, 339, 3.5, 2.6, 0, 0, 7); x.fill();
    $("mScore").textContent = sc + " Blätter"; $("mTime").textContent = Math.max(0, Math.ceil(t)) + " s";

$("mBack").onclick = menu; $("mini").onclick = playMini;
const QN = 3, QO = 25, BABIES = [

${acc}</g>

function playBaby(i) {
  const b = BABIES[i % BABIES.length];
  $("bName").textContent = b[0]; $("bFact").textContent = b[3]; $("bstage").innerHTML = babySvg(b);

$("bBack").onclick = menu;

/* ---------- Spiel ---------- */
const DUR = 60;
let G = null;
const rnd = n => Math.floor(Math.random() * n);
const leaf = on => `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 21C3 10 10 3 21 3c0 11-6 18-18 18z" fill="${on ? "#6f8f78" : "#e0d6c6"}"/><path d="M5 19L16 8" stroke="#fbf8f3" stroke-width="1.4"/></svg>`;
const mult = () => Math.min(5, 1 + Math.floor(G.combo / 3));
const headX = () => 340 - Math.max(0, Math.min(100, G.p)) * 1.18;
function newQ() {
  const r = +$("row").value, q = G.n++ % 3 === 2 && G.retry.length ? G.retry.shift() : [r || 2 + rnd(9), 1 + rnd(10)], [a, b] = q, c = a * b;
  const wrong = new Set();
  while (wrong.size < 3) {
    const w = [c + a, c - a, c + b, c - b, a * (b + 2), (a + 1) * b, c + 10, c - 10, c + 1 + rnd(5)][rnd(9)];
    if (w > 0 && w !== c) wrong.add(w);
  }
  G.q = { a, b, c };
  $("q").textContent = `${a} × ${b}`;
  $("ans").innerHTML = [c, ...wrong].sort(() => Math.random() - .5).map(o => `<button>${o}</button>`).join("");
  [...$("ans").children].forEach(btn => btn.onclick = () => answer(btn, +btn.textContent));
}
function start() {
  G = { score: 0, combo: 0, ok: 0, bad: 0, t: DUR, lock: false, lives: 3, p: 35, defeated: 0, over: false, pause: false, retry: [], n: 0 };
  $("stage").className = "stage"; $("cmsg").textContent = "";
  $("sol").innerHTML = ""; spawn(); show("s-game"); upd(); newQ();
  G.iv = setInterval(() => { if (G.pause) return; G.t -= .25; G.p += G.e[3]; if (G.p >= 100) bite(); upd(); if (G.t <= 0) end(); }, 250);
}
function upd() {
  $("gScore").textContent = G.score + " Blätter";
  $("gLives").innerHTML = [0, 1, 2].map(i => leaf(i < G.lives)).join("");
  $("gTime").textContent = Math.ceil(G.t) + " s";
  $("eName").textContent = `${G.e[0]}: noch ${G.hp} Treffer`;
  $("tbar").style.width = Math.max(0, G.t / DUR * 100) + "%";
  $("snake").style.transform = `translate(${headX()}px,112px)`;
  $("stage").classList.toggle("danger", G.p > 70);
}
let mt;
function mood(m) { const s = $("stage"); s.className = "stage"; void s.getBoundingClientRect(); s.className = "stage " + m; clearTimeout(mt); mt = setTimeout(() => s.className = "stage", 650); }
function shoot() {
  const s = $("shot"); s.style.setProperty("--dx", Math.max(30, headX() - 212) + "px");
  s.classList.remove("fire"); void s.getBoundingClientRect(); s.classList.add("fire");
}
function bite() {
  G.lives--; G.p = 20; G.combo = 0; mood("sad"); beep(150, .3, "sawtooth");
  $("cmsg").textContent = "Autsch! Die Schlange hat zugebissen.";
  if (G.lives <= 0) end();
}
function answer(btn, v) {
  if (G.lock || G.over) return; G.lock = true;
  const good = v === G.q.c;
  ((prof.rows ||= {})[G.q.a] ||= [0, 0])[good ? 0 : 1]++;
  btn.classList.add(good ? "ok" : "no");
  if (good) {
    G.combo++; G.ok++; G.score += 10 * mult();
    G.p = Math.max(8, G.p - 22); G.hp--;
    $("cmsg").textContent = ["Super!", "Genau!", "Stark!", "Treffer!", "Yay!"][rnd(5)] + (mult() > 1 ? ` Serie x${mult()}` : "");
    if (G.hp <= 0) { G.defeated++; G.score += G.e[4]; $("cmsg").textContent = `${G.e[0]} vertrieben! +${G.e[4]} Blätter`; G.p = -15; spawn(); beep(988, .25); }
    beep(520 + G.combo * 25); mood("happy push");
  } else {
    G.combo = 0; G.bad++; G.p += 22;
    G.retry.push([G.q.a, G.q.b]); G.pause = true; $("cmsg").textContent = "Die Schlange kommt näher!"; showSol();
    [...$("ans").children].find(b => +b.textContent === G.q.c).classList.add("ok"); beep(180, .25, "triangle"); mood("sad");
    if (G.p >= 100) bite();

  if (good) setTimeout(() => { if (!G.over) { G.lock = false; newQ(); } }, 280);
}
async function end() {
  if (G.over) return; G.over = true;
  clearInterval(G.iv);

  prof.total += s;
  if (rec) prof.best = s;
  const y = today(new Date(Date.now() - 864e5));
  if (prof.last !== today()) { prof.streak = prof.last === y ? (prof.streak || 0) + 1 : 1; prof.last = today(); }
  const after = itemFor(prof.total), nx = nextItem(prof.total);
  daily();
  prof.qCount = (prof.qCount || 0) + G.defeated;
  let reward = false;
  prof.qOk = (prof.qOk || 0) + G.ok; const t0 = prof.q2Done; if (!t0 && prof.qOk >= QO) { prof.q2Done = true; prof.tickets = (prof.tickets || 0) + 1; }
  if (!prof.qDone && prof.qCount >= QN) { prof.qDone = true; prof.babies = (prof.babies || 0) + 1; reward = true; }
  $("eTitle").textContent = rec && s > 0 ? "Neuer Rekord!" : G.lives <= 0 ? "Die Schlange war schneller" : "Zeit abgelaufen";
  $("eScore").textContent = `${s} Blätter`;
  $("eInfo").textContent = `${G.ok} richtig, ${G.bad} falsch, ${G.defeated} Schlangen vertrieben. Rekord: ${prof.best}. Serie: ${prof.streak} Tage.` + (after[0] > before[0] ? ` Neu freigeschaltet: ${after[1]}!` : "");
  $("eInfo").textContent += !t0 && prof.q2Done ? " Minigame-Ticket verdient!" : "";
  $("eInfo").textContent += reward ? " Tagesquest geschafft: Ein Baby wartet auf dich!" : prof.qDone ? "" : ` Quest: ${Math.min(prof.qCount, QN)} von ${QN} Schlangen.`;
  $("bReward").style.display = reward ? "" : "none"; rewardIdx = (prof.babies || 1) - 1;
  $("eNext").textContent = nx ? `Noch ${nx[0] - prof.total} Blätter bis ${nx[1]}` : "Alles freigeschaltet!";
  $("eBar").style.width = nx ? Math.min(100, (prof.total - after[0]) / (nx[0] - after[0]) * 100) + "%" : "100%";
  $("hat").innerHTML = after[2];
  $("stage").className = "stage";
  if (rec || after[0] > before[0]) [660, 784, 988, 1318].forEach((f, i) => setTimeout(() => beep(f, .2), i * 110));
  show("s-end");
  try { await saveProfile(); } catch { $("eInfo").textContent += " (Speichern fehlgeschlagen. Prüfe das Internet.)"; }
}
